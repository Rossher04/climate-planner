# Blueprint de Render para Climate Planner (backend Django + PostgreSQL).
# En Render: New + -> Blueprint -> conecta este repositorio. Render leera este
# archivo y creara la base de datos y el servicio web automaticamente.
databases:
  - name: climate-db
    plan: free
    databaseName: climate
    user: climate

services:
  - type: web
    name: climate-planner-api
    runtime: python
    plan: free
    rootDir: BACKEND-DJANGO
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true        # Render genera una clave segura
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: climate-db
          property: connectionString
      - key: OPENWEATHER_API_KEY
        sync: false                # se pega manualmente en el dashboard
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false                # tu correo Gmail
      - key: EMAIL_HOST_PASSWORD
        sync: false                # contrasena de aplicacion de Gmail
